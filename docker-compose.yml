services:
  deck-lotus:
    build:
      context: .
      dockerfile: Dockerfile
    image: deck-lotus:latest
    container_name: deck-lotus
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/deck-lotus.db

      # ── Security ────────────────────────────────────────────────────────────
      # Production startup refuses missing/known-default JWT secrets.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a long random value}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}

      # ── Admin user (created on first startup if no admin exists) ───────────
      # If ADMIN_PASSWORD is omitted, Deck Lotus generates a random password
      # and prints it once during the first startup.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

      # ── Mana Pool API (required for price monitoring & cart optimizer) ─────
      - MANAPOOL_USER_EMAIL=${MANAPOOL_USER_EMAIL:-}
      - MANAPOOL_API_TOKEN=${MANAPOOL_API_TOKEN:-}

      # ── TCGPlayer API (optional fallback) ──────────────────────────────────
      - TCGPLAYER_CLIENT_ID=${TCGPLAYER_CLIENT_ID:-}
      - TCGPLAYER_CLIENT_SECRET=${TCGPLAYER_CLIENT_SECRET:-}

      # ── ntfy push notifications (optional) ─────────────────────────────────
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}

      # ── Price check schedule ────────────────────────────────────────────────
      - PRICE_CHECK_SCHEDULE=${PRICE_CHECK_SCHEDULE:-0 */6 * * *}

      # ── Data import ─────────────────────────────────────────────────────────
      - FORCE_REIMPORT=${FORCE_REIMPORT:-false}

    volumes:
      - deck-lotus-data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  deck-lotus-data:
    driver: local
